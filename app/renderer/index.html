<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; img-src 'self' app: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' app: blob:"
    />
    <title>docdoc</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">docdoc<span class="brand-dot">.</span></span>
      <nav aria-label="Main">
        <button data-view="review" class="active">
          Scans & queue <span id="review-count"></span></button
        ><button data-view="library">Library</button>
      </nav>
      <div class="spacer"></div>
      <button id="settings-btn" class="quiet">Settings</button>
      <button id="import-btn">Import</button
      ><button id="scan-btn" class="primary">Scan pages</button>
    </header>
    <div id="message" role="status" hidden></div>
    <section id="processing-panel" aria-label="Document processing" hidden>
      <div class="row between">
        <strong id="processing-label" role="status"></strong
        ><button id="stop-btn" class="small" hidden>Stop</button>
      </div>
      <progress
        id="processing-bar"
        aria-labelledby="processing-label"
      ></progress>
      <div id="processing-stages">
        <span data-stage="prepare">Prepare</span
        ><span data-stage="blank">Remove blanks</span
        ><span data-stage="recognize">Recognize text</span
        ><span data-stage="check">Check pages</span
        ><span data-stage="details">Fill details</span>
      </div>
    </section>
    <div class="app-shell"><aside id="queue-sidebar" class="rail" aria-label="Scans and processing queue"></aside><main id="content"></main></div>
    <footer>
      <span id="operation" role="status">Ready</span><span class="spacer"></span
      ><span>Saved locally · runs while open</span>
    </footer>
    <dialog id="modal"></dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
